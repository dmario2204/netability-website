name: Build posts.json

# Runs whenever a post is added/edited/removed in the CMS (which commits to
# content/news/), or when the build script/workflow itself changes.
on:
  push:
    branches: [main]
    paths:
      - 'content/news/**'
      - 'scripts/build-posts.mjs'
      - '.github/workflows/build-posts.yml'
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # allows the action to commit posts.json back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Build posts.json and post pages
        run: node scripts/build-posts.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "netability-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json posts/
          if git diff --staged --quiet; then
            echo "posts.json and post pages are already up to date."
          else
            # NOTE: do not put "[skip ci]" in this message. Cloudflare Pages
            # honours that marker too and would skip deploying the new pages.
            # This workflow can't re-trigger itself anyway — it only listens to
            # content/news/, scripts/ and .github/workflows/, none of which the
            # commit below touches.
            git commit -m "chore: rebuild posts.json and post pages"
            git push
          fi
